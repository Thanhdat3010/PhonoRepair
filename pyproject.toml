[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phonorepair"
version = "0.1.0"
description = "Clean-Only Geometric Latent Repair across Frozen Speech Recognition Backbones"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Thanhdat & Team" }
]
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "transformers>=4.38.0",
    "datasets>=2.18.0",
    "soundfile>=0.12.1",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "pytest>=7.4.0"
]

[project.scripts]
phonorepair = "phonorepair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
